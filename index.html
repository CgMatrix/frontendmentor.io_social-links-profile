<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
     <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"> <!--https://fonts.google.com/specimen/Inter-->
    <!--Own Fonts-->
    <link rel="stylesheet" href="style.css" />
    
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main class="screen">
      <article class="container">
        <img 
          class="profile" 
          src="./assets/images/avatar-jessica.jpeg"
          alt="User's profile picture" 
          width="5.5rem"
          height="5.5rem"/>
        <h1 class="name">Jessica Randall</h1>
        <h2 class="location">London, United Kingdom</h2>
        <p class="career">"Front-end developer and avid reader."</p>
        <section class="buttons">
          <button>GitHub</button>
          <button>Frontend Mentor</button>
          <button>Linkedln</button>
          <button>Twitter</button>
          <button>Instagram</button>
        </section>
      </article>
    </main>
  </body>
</html>
